<h2>Edit {{ factionId }}</h2>

<div *ngIf="isLoading" class="loading-indicator">
  <p>Loading data...</p>
</div>

<div *ngIf="!isLoading && factionData.length === 0" class="no-data">
  <p>No data found for {{ factionId }}.</p>
  <p>Try creating a new unit.</p>
</div>

<div *ngIf="!isLoading && factionData.length > 0" class="faction-data">
  <h3>Unit List</h3>

  <ul>
    <li *ngFor="let unit of factionData">{{ unit.name }} ({{ unit.type }})</li>
  </ul>
</div>
